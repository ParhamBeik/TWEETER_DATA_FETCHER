[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tweeter-data-fetcher"
version = "4.1.0"
description = "Twitter/X data fetching pipelines with diagnostic tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jdatetime>=5.3",
    "pytz>=2026.2",
    "selenium>=4.0",
    "requests>=2.0",
    "playwright>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
tdf-historical = "tweeter_data_fetcher.pipelines.historical.service:main"
tdf-live = "tweeter_data_fetcher.pipelines.live.service:main"
tdf-search = "tweeter_data_fetcher.pipelines.search.service:main"
tdf-coverage = "tweeter_data_fetcher.observability.coverage_inventory:main"
tdf-auth = "tweeter_data_fetcher.x_api.auth:main"

[tool.setuptools]
package-dir = {"" = "twitter_fetcher/src"}

[tool.setuptools.packages.find]
where = ["twitter_fetcher/src"]
include = ["tweeter_data_fetcher*"]

[tool.pytest.ini_options]
pythonpath = [".", "twitter_fetcher/src", "twitter_fetcher"]
testpaths = ["twitter_fetcher/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v"]
