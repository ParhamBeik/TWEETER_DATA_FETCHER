# Production overlay for a dedicated ~16 GB VPS.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Publish only the frontend; terminate TLS on the host (Caddy) -> :80.
# REDIS_PASSWORD must be set in .env.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Redis gets a password in prod, so every Python service needs the authed URLs.
x-prod-app: &prod-app
  restart: unless-stopped
  logging: *logging
  environment:
    DJANGO_DEBUG: "0"
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g

  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    volumes:
      - redisdata:/data

  web:
    <<: *prod-app
    ports: !reset []
    environment:
      DJANGO_DEBUG: "0"
      ALLOW_REGISTRATION: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    mem_limit: 512m

  # No healthcheck overrides here: compose merge replaces the whole healthcheck
  # block, and an override using `celery inspect ping` made busy workers flap
  # unhealthy. Inherit the base compose's /proc scan.
  worker_live:
    <<: *prod-app
    mem_limit: 768m

  worker_historical:
    <<: *prod-app
    mem_limit: 512m

  worker_search:
    <<: *prod-app
    mem_limit: 3g

  worker_control:
    <<: *prod-app
    mem_limit: 256m

  beat:
    <<: *prod-app
    command: celery -A config beat -l info -s /tmp/celerybeat/celerybeat-schedule
    volumes:
      - beat-schedule:/tmp/celerybeat
    mem_limit: 256m

  frontend:
    ports: !reset []
    expose: ["80"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    # Only the frontend joins the shared edge network -- Caddy terminates HTTPS
    # there and proxies to twitter-frontend:80. Everything else stays private.
    networks:
      default:
      edge:
        aliases: [twitter-frontend]

volumes:
  redisdata:
  beat-schedule:

networks:
  edge:
    external: true
    name: vps-edge
