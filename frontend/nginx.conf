# nginx for the frontend SPA + API reverse proxy.
# Single origin: the browser hits :80 only; /api/ and /admin/ are forwarded to
# the Django `web` service on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. nginx resolves a literal proxy_pass host ONCE at
    # startup, so recreating the `web` container (any redeploy) left this proxy
    # pointing at a stale IP -- which Compose then handed to another service,
    # turning every /api/ call into a 502. Using a variable in proxy_pass forces
    # re-resolution per request against this resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and admin go to gunicorn. Preserve the original path (/api/ prefix
    # stays intact because proxy_pass has no trailing slash here).
    location /api/ {
        set $web_upstream web:8000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $admin_upstream web:8000;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache fingerprinted Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archived tweet photos (compose volume, written by archive_media).
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback: any unknown path serves index.html so client-side routing
    # (react-router) handles deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
