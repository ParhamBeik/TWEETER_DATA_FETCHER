# nginx for the frontend SPA + API reverse proxy.
# Single origin: the browser hits :80 only; /api/ and /admin/ are forwarded to
# the Django `web` service on the compose network.

# The scheme the *browser* used, not the one this hop used. In production Caddy
# terminates HTTPS on the host and proxies here over plain HTTP, so $scheme is
# "http" at this hop -- forwarding that told Django every request was insecure,
# which is what would make SECURE_PROXY_SSL_HEADER, secure cookies and CSRF
# origin checks all disagree with reality. Falls back to $scheme when nothing
# upstream set the header, so the local compose stack is unchanged.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. nginx resolves a literal proxy_pass host ONCE at
    # startup, so recreating the `web` container (any redeploy) left this proxy
    # pointing at a stale IP -- which Compose then handed to another service,
    # turning every /api/ call into a 502. Using a variable in proxy_pass forces
    # re-resolution per request against this resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API and admin go to gunicorn. Preserve the original path (/api/ prefix
    # stays intact because proxy_pass has no trailing slash here).
    location /api/ {
        set $web_upstream web:8000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        set $admin_upstream web:8000;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Long-cache fingerprinted Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Generated feed exports live on the same volume but are NOT public. One
    # archived photo is a public tweet's image with an unguessable name; an
    # export is a bulk extract of the whole archive. It is served by Django,
    # which checks who is asking -- see tweets.views.ExportDownloadView. This
    # block must stay ABOVE the /media/ one: nginx picks the longest matching
    # prefix, so removing it would silently make every export world-readable.
    location /media/exports/ {
        return 404;
    }

    # Archived tweet photos (compose volume, written by archive_media).
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Django admin static files (collected by web, shared via static_data volume).
    location /static/ {
        alias /usr/share/nginx/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback: any unknown path serves index.html so client-side routing
    # (react-router) handles deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
