# nginx for the frontend SPA + API reverse proxy.
# Single origin: the browser hits :80 only; /api/ and /admin/ are forwarded to
# the Django `web` service on the compose network.

# The scheme the *browser* used, not the one this hop used. In production Caddy
# terminates HTTPS on the host and proxies here over plain HTTP, so $scheme is
# "http" at this hop -- forwarding that told Django every request was insecure,
# which is what would make SECURE_PROXY_SSL_HEADER, secure cookies and CSRF
# origin checks all disagree with reality. Falls back to $scheme when nothing
# upstream set the header, so the local compose stack is unchanged.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. nginx resolves a literal proxy_pass host ONCE at
    # startup, so recreating the `web` container (any redeploy) left this proxy
    # pointing at a stale IP -- which Compose then handed to another service,
    # turning every /api/ call into a 502. Using a variable in proxy_pass forces
    # re-resolution per request against this resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers for locations that do not set their own add_header.
    # Locations that do (/assets/, /media/, /static/) repeat them: nginx drops
    # parent add_header as soon as a child sets one.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # API and admin go to gunicorn. Preserve the original path (/api/ prefix
    # stays intact because proxy_pass has no trailing slash here).
    location /api/ {
        set $web_upstream web:8000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        set $admin_upstream web:8000;
        proxy_pass http://$admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Long-cache fingerprinted Vite assets.
    #
    # One Cache-Control, not two. `expires 1y` emits its own max-age header, so
    # pairing it with an explicit add_header sent the live site *both*
    # `max-age=31536000` and `public, immutable` as separate header lines.
    # Clients that join duplicates read the union and behave; the ones that take
    # the first win get a directive with no `immutable` in it. Saying it once
    # removes the question.
    # No `always` on long-lived cache headers: a missing file must not inherit
    # the lifetime of a successful response. Security headers still cover errors.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    # Generated feed exports live on the same volume but are NOT public. One
    # archived photo is a public tweet's image with an unguessable name; an
    # export is a bulk extract of the whole archive. It is served by Django,
    # which checks who is asking -- see tweets.views.ExportDownloadView. This
    # block must stay ABOVE the /media/ one: nginx picks the longest matching
    # prefix, so removing it would silently make every export world-readable.
    location /media/exports/ {
        return 404;
    }

    # Archived tweet photos (compose volume, written by archive_media).
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }

    # Django admin static files (collected by web, shared via static_data volume).
    location /static/ {
        alias /usr/share/nginx/staticfiles/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }

    # SPA fallback: any unknown path serves index.html so client-side routing
    # (react-router) handles deep links.
    #
    # index.html must NOT be cached. It is the only unfingerprinted file here,
    # and it is what names the fingerprinted bundles: a browser or an
    # intermediary holding yesterday's copy asks for yesterday's /assets/*.js,
    # which the new image no longer contains -- a blank page after a deploy that
    # every server-side check calls healthy. nginx's default is to send only
    # Last-Modified, which lets a proxy heuristically cache it; saying no-cache
    # is what makes the revalidation mandatory rather than a guess.
    #
    # The three security headers are repeated because nginx drops every
    # inherited add_header the moment a location sets one of its own.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }
}
