# Production overlay for a dedicated ~16 GB VPS.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Publish only the frontend. Terminate TLS on the host (Caddy/nginx) → :80.
# Set strong secrets in .env before starting (REDIS_PASSWORD required).
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: *json-logging
    mem_limit: 1g

  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    logging: *json-logging
    mem_limit: 256m
    volumes:
      - redisdata:/data

  web:
    ports: !reset []
    restart: unless-stopped
    logging: *json-logging
    environment:
      DJANGO_DEBUG: "0"
      ALLOW_REGISTRATION: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    mem_limit: 512m

  worker:
    restart: unless-stopped
    logging: *json-logging
    environment:
      DJANGO_DEBUG: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    # This overlay used to redefine the healthcheck with `celery inspect ping`,
    # which silently overrode the base compose's already-fixed /proc-scan check
    # (compose merge replaces the whole healthcheck block, not per-field) --
    # `inspect ping` can't answer while a -P solo worker is mid-task, so a busy
    # (working correctly) worker kept flapping unhealthy. No override here now;
    # inherit the base compose's healthcheck.
    mem_limit: 3g

  beat:
    restart: unless-stopped
    logging: *json-logging
    environment:
      DJANGO_DEBUG: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - beat-schedule:/tmp/celerybeat
    command: celery -A config beat -l info -s /tmp/celerybeat/celerybeat-schedule
    mem_limit: 256m

  frontend:
    ports: !reset []
    expose: ["80"]
    restart: unless-stopped
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    # Only the frontend joins the shared edge network -- Caddy (deploy/edge/)
    # terminates real HTTPS there and reverse-proxies to twitter-frontend:80.
    # Postgres/Redis/web/worker/beat stay off it, private-network-only.
    networks:
      default:
      edge:
        aliases: [twitter-frontend]

volumes:
  redisdata:
  beat-schedule:

networks:
  edge:
    external: true
    name: vps-edge
