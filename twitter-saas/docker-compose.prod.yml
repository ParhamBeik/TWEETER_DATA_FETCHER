# Production overlay for a dedicated ~16 GB VPS.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Publish only the frontend. Terminate TLS on the host (Caddy/nginx) → :80.
# Set strong secrets in .env before starting (REDIS_PASSWORD required).
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1g

  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redisdata:/data

  web:
    ports: !reset []
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      ALLOW_REGISTRATION: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    mem_limit: 512m

  worker:
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 3g

  beat:
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - beat-schedule:/tmp/celerybeat
    command: celery -A config beat -l info -s /tmp/celerybeat/celerybeat-schedule
    mem_limit: 256m

  frontend:
    ports: !override
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m

volumes:
  redisdata:
  beat-schedule:
