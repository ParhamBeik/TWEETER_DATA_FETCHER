name: CI

on:
  push:
    branches: [main, simplify]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (engine + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs on SQLite locally with no services, which is deliberate and
    # stays true. But every raw-SQL analytics view checks connection.vendor and
    # returns early on SQLite, so a green SQLite run proves nothing about topic
    # mining, velocity, narratives or request spend -- and nothing about the
    # generated column or the trigram indexes either. CI runs the real database
    # so those tests actually execute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twitter_saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every source tree
        # Catches syntax errors in modules no test happens to import.
        run: python -m compileall -q config fetcher fetching tweets tests

      - name: Check for missing migrations
        # A model edited without `makemigrations` boots fine locally and then
        # fails on a fresh deploy; fail here instead.
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test

      - name: Run the suite
        # pytest.ini pins DJANGO_SETTINGS_MODULE=config.settings_test, which
        # picks Postgres when TEST_POSTGRES_HOST is set and SQLite otherwise.
        # Setting it here is what makes the vendor-gated analytics tests run
        # instead of skipping.
        run: python -m pytest -q
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: "5432"
          TEST_POSTGRES_DB: twitter_saas_test
          TEST_POSTGRES_USER: postgres
          TEST_POSTGRES_PASSWORD: postgres

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (via vitest) pulls undici 8, which hard-requires
          # >=22.19.0 and dies with "webidl.util.markAsUncloneable is not a
          # function" on anything older. Matches the dev machine.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the component suite
        run: npm test

      - name: Verify the production bundle builds
        # A test suite can pass while the real Vite build breaks on an
        # unresolved import; the app is served from this bundle.
        run: npm run build

  deploy:
    name: Deploy to the VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a deploy in flight: the wrapper resets the checkout and
    # rebuilds containers, and killing it partway leaves the box in a state
    # neither commit describes. Queue instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Authorize against the VPS
        # Host key comes from a secret rather than StrictHostKeyChecking=no:
        # this step hands a private key to whatever answers on port 22, so the
        # host has to prove who it is first.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull, rebuild, and health-check
        # The wrapper lives outside the repo on purpose: it is what runs
        # `git reset --hard`, and a script cannot safely rewrite itself while
        # bash is still reading it. It calls scripts/deploy_vps.sh afterwards,
        # which fails the job if the API does not come back up.
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'bash -s' << 'EOF'
          set -e
          if sudo -n true 2>/dev/null; then
            sudo chown -R "$(id -u):$(id -g)" /opt/apps/ 2>/dev/null || true
          fi
          find /opt/apps/ -name .git -exec chmod -R u+rwX {} + 2>/dev/null || true
          /opt/apps/deploy_twitter.sh
          EOF

      - name: Discard the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
