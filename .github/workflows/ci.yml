name: CI

on:
  push:
    branches: [main, simplify]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (engine + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite runs on SQLite locally with no services, which is deliberate and
    # stays true. But every raw-SQL analytics view checks connection.vendor and
    # returns early on SQLite, so a green SQLite run proves nothing about topic
    # mining, velocity, narratives or request spend -- and nothing about the
    # generated column or the trigram indexes either. CI runs the real database
    # so those tests actually execute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twitter_saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Must match backend/Dockerfile. A suite that passes on one interpreter
          # says nothing about the image if the image runs another.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install requirements
        # The dev file holds the tools that check the code but never run inside
        # it, so they stay out of the production image (backend/Dockerfile
        # installs requirements.txt verbatim).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit pinned Python dependencies
        run: pip-audit -r requirements.txt

      - name: Byte-compile every source tree
        # Catches syntax errors in modules no test happens to import.
        run: python -m compileall -q config engine fetching tweets tests

      - name: Lint
        # compileall proves a module parses; it says nothing about a name that
        # no longer exists on a branch no test covers, an import left behind by
        # a refactor, or a mutable default argument. The first run of this found
        # a `# noqa`-free unused import that pytest was resolving by name inside
        # a skipif string. Rules and the reasoning for each exclusion are in
        # backend/pyproject.toml.
        run: ruff check .

      - name: Check for missing migrations
        # A model edited without `makemigrations` boots fine locally and then
        # fails on a fresh deploy; fail here instead.
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test

      - name: Django deploy checks
        # Same layout as production: TLS terminates upstream, so W008 is silenced
        # in settings. A dummy secret is enough; this job never talks to users.
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: ci-deploy-check-key-not-for-production-use-abcdef12
          DJANGO_DEBUG: "0"
          DJANGO_SECURE_SSL: "1"
          DJANGO_ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: twitter_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      - name: Run the suite
        # pytest.ini pins DJANGO_SETTINGS_MODULE=config.settings_test, which
        # picks Postgres when TEST_POSTGRES_HOST is set and SQLite otherwise.
        # Setting it here is what makes the vendor-gated analytics tests run
        # instead of skipping.
        run: python -m pytest -q
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: "5432"
          TEST_POSTGRES_DB: twitter_saas_test
          TEST_POSTGRES_USER: postgres
          TEST_POSTGRES_PASSWORD: postgres

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 (via vitest) pulls undici 8, which hard-requires
          # >=22.19.0 and dies with "webidl.util.markAsUncloneable is not a
          # function" on anything older. Matches the dev machine.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Hooks rules, not formatting. A stale useEffect dependency list passes
        # both the suite and the build and then shows up as a filter chip that
        # silently reverts itself; frontend/eslint.config.js says which rules
        # are on and why the React Compiler ones are not.
        run: npm run lint

      - name: Run the component suite
        run: npm test

      - name: Verify the production bundle builds
        # A test suite can pass while the real Vite build breaks on an
        # unresolved import; the app is served from this bundle.
        run: npm run build

  deploy:
    name: Deploy to the VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a deploy in flight: the wrapper resets the checkout and
    # rebuilds containers, and killing it partway leaves the box in a state
    # neither commit describes. Queue instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Authorize against the VPS
        # Host key comes from a secret rather than StrictHostKeyChecking=no:
        # this step hands a private key to whatever answers on port 22, so the
        # host has to prove who it is first.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Pull, rebuild, and health-check
        # The wrapper lives outside the repo on purpose: it is what runs
        # `git reset --hard`, and a script cannot safely rewrite itself while
        # bash is still reading it. It calls scripts/deploy_vps.sh afterwards,
        # which fails the job if the API does not come back up.
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'bash -s' << 'EOF'
          set -e
          docker run --rm -v /opt/apps/twitter-project:/mnt postgres:16-alpine chown -R "$(id -u):$(id -g)" /mnt 2>/dev/null || true
          chmod -R u+rwX /opt/apps/twitter-project/.git 2>/dev/null || true
          /opt/apps/deploy_twitter.sh
          EOF

      - name: Discard the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
